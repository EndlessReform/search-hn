# Operational owner of the shared model. Host Caddy fronts the loopback ports.
name: homelab-inference
services:
  vllm:
    image: vllm/vllm-openai@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    user: "1000:1000"
    gpus: all
    shm_size: 1gb
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - /opt/searchhn-embeddings/hf-cache:/hf-cache
      - /opt/searchhn-embeddings/vllm:/cache
    environment:
      HF_HUB_CACHE: /hf-cache
      HF_HOME: /cache/hf-home
      VLLM_CACHE_ROOT: /cache/vllm-cache
      XDG_CACHE_HOME: /cache/xdg
      TRITON_CACHE_DIR: /cache/triton
      VLLM_NO_USAGE_STATS: "1"
    command:
      - perplexity-ai/pplx-embed-v1-0.6b
      - --revision
      - 2c4d510dd4a732063c31a0f70193e35067b51fd8
      - --trust-remote-code
      - --model-impl
      - vllm
      - --runner
      - pooling
      - --convert
      - embed
      - --hf-overrides
      - '{"architectures":["Qwen3Model"],"is_causal":false}'
      - --pooler-config
      - '{"pooling_type":"MEAN","use_activation":false}'
      - --dtype
      - bfloat16
      - --attention-backend
      - FLASH_ATTN
      - --max-model-len
      - "2048"
      - --max-num-seqs
      - "64"
      - --max-num-batched-tokens
      - "8192"
      # Pooling uses encoder-only attention, which allocates no KV cache. This
      # explicit zero also prevents an accidental default 90% KV allocation.
      # gpu-memory-utilization is a planning value, not a hard CUDA memory limit.
      - --kv-cache-memory-bytes
      - "0"
      - --gpu-memory-utilization
      - "0.35"
      - --no-enable-prefix-caching
      - --no-enable-chunked-prefill
      - --enforce-eager
      - --scheduling-policy
      - priority
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - pplx-embed-v1-0.6b
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s

  embedding-proxy:
    image: ${EMBEDDING_PROXY_IMAGE:?Set the published repository@sha256 digest in .env}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      EMBED_BACKEND: http://vllm:8000
      RUST_LOG: embedding_proxy=info
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
