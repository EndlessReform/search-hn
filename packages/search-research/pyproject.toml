[project]
name = "search-research"
version = "0.1.0"
description = "Reproducible known-story retrieval experiments"
requires-python = ">=3.13"
dependencies = [
    "search-agent",
    "polars>=1.0",
    "aiolimiter>=1.2.1",
    "tiktoken>=0.14.0",
    "numpy>=2.4.2",
    "duckdb>=1.5.5",
    "pyarrow>=23.0.0",
    "boto3>=1.43.89",
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.5",
]

[project.scripts]
hn-eval = "search_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
search-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
